services:
  ollama:
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}

  mokli-ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/mokli-ui/mokli-ui:${MOKLI_DOCKER_TAG-main}
    container_name: mokli-ui
    volumes:
      - mokli-ui:/app/backend/data
    depends_on:
      - ollama
    ports:
      - ${MOKLI_UI_PORT-3000}:8080
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'MOKLI_SECRET_KEY='
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  ollama: {}
  mokli-ui: {}
